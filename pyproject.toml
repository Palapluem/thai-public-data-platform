[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-public-data-platform"
version = "0.1.0"
description = "A trustworthy PostgreSQL-to-ClickHouse public data platform portfolio project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "clickhouse-connect>=0.8,<1",
  "openpyxl>=3.1,<4",
  "pyarrow>=18,<24",
  # Airflow 2.10.5 providers in the local runtime require pandas <2.2.
  "pandas>=2.1.2,<2.2",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
thai-data-platform = "thai_data_platform.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
markers = [
  "integration: requires locally running PostgreSQL or ClickHouse services",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

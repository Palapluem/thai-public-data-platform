name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Validate repository contracts
        run: |
          python -m json.tool config/source_manifest.json > /dev/null
          python -m json.tool config/schema_contracts.json > /dev/null
          python -m json.tool config/public_source_contract.json > /dev/null
          python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('config/public_sources.yml').read_text(encoding='utf-8'))"
          python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('analytics/metrics/definitions.yml').read_text(encoding='utf-8'))"
          python -m compileall -q src
          git diff --check
      - name: Unit and integration tests
        run: python -m pytest
      - name: Build application image
        run: docker build --tag thai-public-data-platform:ci .

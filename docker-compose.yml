name: thai-public-data-platform

x-airflow-build: &airflow-build
  context: .
  dockerfile: docker/airflow.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thai_data_platform}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-thai_data_platform}"]
      interval: 5s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-init:
    build: *airflow-build
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thai_data_platform}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      PYTHONPATH: /opt/airflow/src
      POSTGRES_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thai_data_platform}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: analytics
      OCSC_SOURCE_PATH: /opt/airflow/datasets/ocsc/thai-gov-manpower-2567.4.xlsx
      CGD_SOURCE_PATH: /opt/airflow/datasets/cgd/2026.07.03.xlsx
      RAW_ROOT: /opt/airflow/data/raw
      SOURCE_MANIFEST: /opt/airflow/config/source_manifest.json
      POSTGRES_MIGRATIONS: /opt/airflow/sql/postgres
      CLICKHOUSE_MIGRATIONS: /opt/airflow/sql/clickhouse
      ANALYTICS_QUERY_DIR: /opt/airflow/analytics/queries
      PUBLIC_SOURCE_CONFIG: /opt/airflow/config/public_sources.yml
      PUBLIC_ANALYTICS_QUERY_DIR: /opt/airflow/analytics/queries/public
      PUBLIC_PIPELINE_RUN_TYPE: ${PUBLIC_PIPELINE_RUN_TYPE:-scheduled}
      PUBLIC_DASHBOARD_OUTPUT: /opt/airflow/data/processed/public_dashboard/index.html
      SCHEMA_CONTRACT: /opt/airflow/config/schema_contracts.json
      PIPELINE_RUN_TYPE: ${PIPELINE_RUN_TYPE:-manual}
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./sql:/opt/airflow/sql:ro
      - ./analytics:/opt/airflow/analytics:ro
      - ./datasets:/opt/airflow/datasets:ro
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create
        --username "$${AIRFLOW_ADMIN_USER}"
        --firstname Local
        --lastname Admin
        --role Admin
        --email local@example.invalid
        --password "$${AIRFLOW_ADMIN_PASSWORD}" || true
    restart: "no"

  airflow-scheduler:
    build: *airflow-build
    environment: *airflow-environment
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-webserver:
    build: *airflow-build
    environment: *airflow-environment
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    command: webserver

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
